version: "3.9"
services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports: ["9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.0
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    ports: ["5601:5601"]

  apm:
    image: docker.elastic.co/apm/apm-server:8.18.0
    command: ["--strict.perms=false"]
    environment:
      - output.elasticsearch.hosts=["http://es01:9200"]
      - output.elasticsearch.password=${ELASTIC_PASSWORD}
      - apm-server.auth.api_key.enabled=true
      - apm-server.otlp.enabled=true     # OTLP = one port, all signals
    ports: ["8200:8200"]
volumes: { esdata: {} }
