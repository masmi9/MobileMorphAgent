name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 21 * * 2'  # Tuesday scan from Config 1
    - cron: '0 0 * * 0'    # Sunday scan from Config 2

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # JS/TS - no build needed
          - language: javascript-typescript
            build-mode: none
          # Python - no build needed
          - language: python
            build-mode: none
          # Android (Java/Kotlin) - manual Gradle build in android_agent/
          - language: java-kotlin
            build-mode: manual
          # C/C++ - manual build in injector/
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}

      # ----------------- Android / Kotlin / Java -----------------
      - name: Set up JDK 17
        if: matrix.build-mode == 'autobuild'
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '17'
      
      - name: Install Android SDK commandline tools
        if: matrix.language == 'java-kotlin'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget unzip
          ANDROID_HOME=$HOME/Android/Sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      
      - name: Build C/C++ (injector) - Makefile
        if: matrix.language == 'c-cpp' && hashFiles('injector/Makefile') != ''
        run: |
          set -e
          make -C injector -j"$(nproc)"

      - name: Build C/C++ (injector) - CMake
        if: matrix.language == 'c-cpp' && hashFiles('injector/CMakeLists.txt') != ''
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          mkdir -p injector/build
          cd injector/build
          cmake ..
          make -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"