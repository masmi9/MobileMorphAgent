name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 21 * * 2'  # Tuesday scan from Config 1
    - cron: '0 0 * * 0'    # Sunday scan from Config 2

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # JS/TS - no build needed
          - language: javascript-typescript
            build-mode: none
          # Python - no build needed
          - language: python
            build-mode: none
          # Android (Java/Kotlin) - manual Gradle build in android_agent/
          - language: java-kotlin
            build-mode: manual
          # C/C++ - manual build in injector/
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}

      # ----------------- Android / Kotlin / Java -----------------
      - name: Set up JDK 17
        if: matrix.build-mode == 'autobuild'
        uses: actions/setup-java@v5
        with:
            distribution: 'temurin'
            java-version: '17'
      
      - name: Install Android SDK commandline tools
        if: matrix.language == 'java-kotlin'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget unzip
          export ANDROID_HOME=$HOME/Android/Sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          {
            echo "$ANDROID_HOME/platform-tools"
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/tools/bin" 
          } >> "$GITHUB_PATH"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | $SDKM --licenses > /dev/null || true
          yes 2>/dev/null | "$SDKM" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" > /dev/null 

      - name: Normalize Makefile (line endings/BOM)
        if: matrix.language == 'java-kotlin' && hashFiles('injector/Makefile') != ''
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y dos2unix
          dos2unix injector/Makefile || true
          # strip UTF-8 BOM if present
          sed -i '1s/^\xEF\xBB\xBF//' injector/Makefile || true

      - name: Build C/C++ (injector) - Makefile
        if: matrix.language == 'c-cpp' && hashFiles('injector/Makefile') != ''
        run: |
          set -e
          sudo apt-get install -y build-essential
          make -C injector -j"$(nproc)"

      - name: Build C/C++ (injector) - CMake
        if: matrix.language == 'c-cpp' && hashFiles('injector/CMakeLists.txt') != ''
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          cmake -S injector -B injector/build -DCMAKE_BUILD_TYPE=Release
          cmake --build injector/build -- -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"